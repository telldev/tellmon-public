---
- name: Update Tellmon PostgreSQL password on localhost
  hosts: localhost
  connection: local
  become: true
  vars:
    postgres_password: "{{ lookup('ansible.builtin.env', 'TELLMON_POSTGRESQL_PASSWORD') }}"
  tasks:
    - name: Import update PostgreSQL password tasks
      ansible.builtin.import_tasks: update-postgres-password-tasks.yml

---
- name: Record installed Docker image digests
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    compose_file: /docker/tellmon/docker-compose.yml
    digest_file: /docker/tellmon/config/image-digests.json
    # Docker Hub references may carry these prefixes in RepoDigests.
    hub_prefix_pattern: '^(docker\.io/)?(registry-1\.docker\.io/)?(library/)?'
  tasks:
    - name: Read deployed Compose file
      ansible.builtin.slurp:
        src: "{{ compose_file }}"
      register: compose_content
      no_log: true

    - name: Collect the image of each service
      ansible.builtin.set_fact:
        service_images: >-
          {{ dict(compose_services | dict2items | map(attribute='key')
                  | zip(compose_services | dict2items | map(attribute='value.image'))) }}
      vars:
        compose_services: "{{ (compose_content.content | b64decode | from_yaml).services }}"

    - name: Inspect installed service images
      community.docker.docker_image_info:
        name: "{{ item.value }}"
      loop: "{{ service_images | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: image_info

    - name: Select the repository digest of each service image
      ansible.builtin.set_fact:
        image_digests: >-
          {{ image_digests | default({}) | combine({item.item.key: {
               'image': item.item.value,
               'digest': ((item.images | default([]) | first | default({})).RepoDigests | default([]))
                         | select('match', digest_pattern)
                         | map('regex_replace', '^.*@', '')
                         | first | default('')
             }}) }}
      vars:
        repository: "{{ item.item.value | regex_replace(':[^:/]*$', '') | regex_replace(hub_prefix_pattern, '') }}"
        digest_pattern: "{{ hub_prefix_pattern ~ (repository | regex_escape) ~ '@sha256:[0-9a-fA-F]{64}$' }}"
      loop: "{{ image_info.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Ensure every service image has a repository digest
      ansible.builtin.assert:
        that: missing_digests | length == 0
        fail_msg: "No matching repository digest for {{ missing_digests | join(', ') }}"
      vars:
        missing_digests: >-
          {{ image_digests | dict2items | rejectattr('value.digest') | map(attribute='value.image') | list }}

    - name: Save repository digests
      ansible.builtin.copy:
        dest: "{{ digest_file }}"
        content: "{{ image_digests | to_nice_json(indent=2, sort_keys=true) }}\n"
        mode: "0644"

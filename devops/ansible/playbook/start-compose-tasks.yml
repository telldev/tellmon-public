---
- name: Start Tellmon containers in dependency order
  ansible.builtin.script:
    cmd: >-
      {{ (playbook_dir ~ '/../../tellmon-compose-start.py') | quote }}
      --compose-dir /docker/tellmon
      {{ '--pull' if (pull_compose_images | default(true) | bool) else '' }}
    executable: /usr/bin/python3
  changed_when: true

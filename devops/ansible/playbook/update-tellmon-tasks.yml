---
- name: Check if Tellmon docker-compose file exists
  ansible.builtin.stat:
    path: /docker/tellmon/docker-compose.yml
  register: compose_file_stat

- name: Ensure Tellmon is already installed
  ansible.builtin.assert:
    that:
      - compose_file_stat.stat.exists
      - not compose_file_stat.stat.isdir
    fail_msg: "Tellmon docker-compose.yml was not found at /docker/tellmon/docker-compose.yml. Please run the Install Tellmon action first."

- name: Refresh Compose configuration before updating containers
  ansible.builtin.import_tasks: refresh-compose-tasks.yml

- name: Read deployed Compose configuration for manager modem access
  ansible.builtin.slurp:
    src: /docker/tellmon/docker-compose.yml
  register: gsm_compose_file
  no_log: true

- name: Parse deployed Compose configuration
  ansible.builtin.set_fact:
    gsm_compose: "{{ gsm_compose_file.content | b64decode | from_yaml }}"
  no_log: true

- name: Add manager access to host USB metadata and command socket
  ansible.builtin.set_fact:
    gsm_compose: >-
      {{ gsm_compose | combine({'services': {'manager': {'volumes':
        ((gsm_compose.services.manager.volumes | default([])) +
        ['/sys:/host/sys:ro', './reboot.sock:/var/run/reboot.sock']) | unique | list
      }}}, recursive=true) }}
  when: "'manager' in gsm_compose.services"
  no_log: true

- name: Save manager modem access in deployed Compose configuration
  ansible.builtin.copy:
    dest: /docker/tellmon/docker-compose.yml
    content: "{{ gsm_compose | to_nice_yaml(indent=2, sort_keys=false) }}"
  when: "'manager' in gsm_compose.services"
  no_log: true

- name: Ensure root-owned Tellmon helper directory exists
  ansible.builtin.file:
    path: "/usr/local/lib/tellmon/bin"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Update root-owned Tellmon helper scripts
  ansible.builtin.copy:
    src: "{{ tellmon_helper_bin_src }}/"
    dest: "/usr/local/lib/tellmon/bin/"
    owner: root
    group: root
    mode: "0755"
  ignore_errors: true

- name: Update root-owned host modem command
  ansible.builtin.copy:
    src: "{{ tellmon_helper_bin_src }}/command-host.sh"
    dest: "/usr/local/lib/tellmon/bin/command-host.sh"
    owner: root
    group: root
    mode: "0755"
  ignore_errors: true

- name: Update host reboot listener
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../tellmon-reboot-listener.py"
    dest: /usr/local/bin/tellmon-reboot-listener.py
    owner: root
    group: root
    mode: "0755"
  register: reboot_listener_update

- name: Restart updated host reboot listener
  ansible.builtin.systemd:
    name: tellmon-reboot-listener.service
    state: restarted
  when: reboot_listener_update.changed

- name: Update jwt.secret in shared application.properties
  ansible.builtin.lineinfile:
    path: "/docker/tellmon/config/application.properties"
    regexp: '^jwt\.secret\s*='
    line: "jwt.secret={{ jwt_secret }}"
  when: jwt_secret is defined and (jwt_secret | length > 0)
  no_log: true

- name: Update datakeep.api.code in shared application.properties
  ansible.builtin.lineinfile:
    path: "/docker/tellmon/config/application.properties"
    regexp: '^datakeep\.api\.code\s*='
    line: "datakeep.api.code={{ datakeep_api_code }}"
  when: datakeep_api_code is defined and (datakeep_api_code | length > 0)
  no_log: true

- name: Update webapi.apikey in shared application.properties
  ansible.builtin.lineinfile:
    path: "/docker/tellmon/config/application.properties"
    regexp: '^webapi\.apikey\s*='
    line: "webapi.apikey={{ webapi_api_key }}"
  when: webapi_api_key is defined and (webapi_api_key | length > 0)
  no_log: true

- name: Update warranty.apikey in shared application.properties
  ansible.builtin.lineinfile:
    path: "/docker/tellmon/config/application.properties"
    regexp: '^warranty\.apikey\s*='
    line: "warranty.apikey={{ warranty_api_key }}"
  when: warranty_api_key is defined and (warranty_api_key | length > 0)
  no_log: true

- name: Update lang.apikey in shared application.properties
  ansible.builtin.lineinfile:
    path: "/docker/tellmon/config/application.properties"
    regexp: '^lang\.apikey\s*='
    line: "lang.apikey={{ lang_api_key }}"
  when: lang_api_key is defined and (lang_api_key | length > 0)
  no_log: true

- name: Update lang.app.code in shared application.properties
  ansible.builtin.lineinfile:
    path: "/docker/tellmon/config/application.properties"
    regexp: '^lang\.app\.code\s*='
    line: "lang.app.code={{ lang_app_code }}"
  when: lang_app_code is defined and (lang_app_code | length > 0)
  no_log: true

- name: Update containers in dependency order
  ansible.builtin.import_tasks: update-compose-containers-tasks.yml

- name: Remove unused docker images and builder cache
  community.docker.docker_prune:
    images: true
    builder_cache: true

- name: Install ordered startup for subsequent boots
  ansible.builtin.import_tasks: install-startup-tasks.yml

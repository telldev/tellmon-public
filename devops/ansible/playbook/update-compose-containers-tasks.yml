---
# Pull before stopping services, so download failures leave the stack running.
- name: Pull updated Docker images
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ tellmon_compose_dir | default('/docker/tellmon') }}"
      - -f
      - "{{ tellmon_compose_dir | default('/docker/tellmon') }}/docker-compose.yml"
      - pull
  changed_when: true

- name: Stop containers before applying the update
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ tellmon_compose_dir | default('/docker/tellmon') }}"
      - -f
      - "{{ tellmon_compose_dir | default('/docker/tellmon') }}/docker-compose.yml"
      - stop
  changed_when: true

# Separate Compose invocations avoid stale dependency IDs during graph recreation.
# Include tasks rather than looping the command: failure must stop subsequent services.
- name: Recreate and wait for each service in dependency order
  ansible.builtin.include_tasks: start-compose-service-tasks.yml
  loop:
    - postgres
    - manager
    - receiver
    - backend
    - caddy
  loop_control:
    loop_var: tellmon_update_service

---
- name: Set Tellmon JWT secret on localhost
  hosts: localhost
  connection: local
  become: true
  vars:
    jwt_secret: "{{ lookup('ansible.builtin.env', 'TELLMON_JWT_SECRET') }}"
  tasks:
    - name: Validate JWT secret
      ansible.builtin.assert:
        that:
          - jwt_secret | length >= 10
        fail_msg: "JWT secret must contain at least 10 characters"
      no_log: true

    - name: Check shared application properties
      ansible.builtin.stat:
        path: /docker/tellmon/config/application.properties
      register: application_properties

    - name: Ensure application properties exist
      ansible.builtin.assert:
        that:
          - application_properties.stat.isreg | default(false)
        fail_msg: "Missing /docker/tellmon/config/application.properties after container installation"

    - name: Escape JWT secret for Java properties
      ansible.builtin.set_fact:
        jwt_secret_properties: >-
          {{
            jwt_secret
            | replace('\\', '\\\\')
            | replace(':', '\\:')
            | replace('=', '\\=')
            | replace(' ', '\\ ')
          }}
      no_log: true

    - name: Update JWT secret in shared application properties
      ansible.builtin.lineinfile:
        path: /docker/tellmon/config/application.properties
        regexp: '^jwt\.secret\s*='
        line: "jwt.secret={{ jwt_secret_properties }}"
      no_log: true

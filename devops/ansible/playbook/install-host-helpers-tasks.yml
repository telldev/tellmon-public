---
- name: Ensure root-owned Tellmon helper directory exists
  ansible.builtin.file:
    path: /usr/local/lib/tellmon/bin
    state: directory
    owner: root
    group: root
    mode: "0755"

# Manager seeds the shared bin directory from its image before this task runs.
# command.sh in that directory is the container socket forwarder; the host
# script is published next to it as host/command.sh.
- name: Install host command helper from the deployed manager image
  ansible.builtin.copy:
    src: /docker/tellmon/bin/host/command.sh
    dest: /usr/local/lib/tellmon/bin/command.sh
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Ensure root-owned Tellmon helper scripts directory exists
  ansible.builtin.file:
    path: /usr/local/lib/tellmon/bin/scripts
    state: directory
    owner: root
    group: root
    mode: "0755"

# The host listener runs it for the backend (SYSTEM_INFO), so the system
# information shows the host's memory, processes, users and disk.
- name: Install host system information script from the deployed manager image
  ansible.builtin.copy:
    src: /docker/tellmon/bin/scripts/T02system-info.sh
    dest: /usr/local/lib/tellmon/bin/scripts/T02system-info.sh
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Install host modem helpers from the deployed manager image
  ansible.builtin.copy:
    src: "/docker/tellmon/bin/{{ item }}"
    dest: "/usr/local/lib/tellmon/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: is_physical_mode | bool
  loop:
    - wvdial_3g.sh
    - internal_3g.sh

# Docker restores the containers at boot through their restart policy.
- name: Enable Docker at boot
  ansible.builtin.systemd:
    name: docker.service
    enabled: true

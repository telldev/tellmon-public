---
- name: Validate required PostgreSQL password variable
  ansible.builtin.assert:
    that:
      - postgres_password is defined
      - postgres_password | length > 0
    fail_msg: "postgres_password must be provided"
  no_log: true

- name: Check deployed docker-compose file
  ansible.builtin.stat:
    path: /docker/tellmon/docker-compose.yml
  register: tellmon_compose_file

- name: Ensure Tellmon is deployed
  ansible.builtin.assert:
    that:
      - tellmon_compose_file.stat.exists
    fail_msg: "Tellmon docker-compose file was not found at /docker/tellmon/docker-compose.yml"

- name: Prepare password for Java properties files
  ansible.builtin.set_fact:
    postgres_password_properties: >-
      {{
        postgres_password
        | replace('\\', '\\\\')
        | replace(':', '\\:')
        | replace('=', '\\=')
      }}
  no_log: true

- name: Check PostgreSQL container
  community.docker.docker_container_info:
    name: tellmon_db
  register: tellmon_postgres_container

- name: Ensure PostgreSQL container is running
  ansible.builtin.assert:
    that:
      - tellmon_postgres_container.exists
      - tellmon_postgres_container.container.State.Running
    fail_msg: "PostgreSQL container tellmon_db is not running"

- name: Stop backend container before password rotation
  community.docker.docker_container:
    name: tellmon_backend
    state: stopped

- name: Stop receiver container before password rotation
  community.docker.docker_container:
    name: tellmon_receiver
    state: stopped

- name: Update PostgreSQL root role password
  community.docker.docker_container_exec:
    container: tellmon_db
    argv:
      - psql
      - -U
      - root
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        ALTER ROLE root WITH PASSWORD '{{ postgres_password | replace("'", "''") }}';
  no_log: true

- name: Verify new PostgreSQL password against Tellmon database
  community.docker.docker_container_exec:
    container: tellmon_db
    env:
      PGPASSWORD: "{{ postgres_password | string }}"
    argv:
      - psql
      - -h
      - 127.0.0.1
      - -U
      - root
      - -d
      - tellmon
      - -v
      - ON_ERROR_STOP=1
      - -c
      - SELECT 1;
  no_log: true

- name: Ensure Tellmon config directory exists
  ansible.builtin.file:
    path: /docker/tellmon/config
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"

- name: Create shared application.properties if missing
  ansible.builtin.copy:
    dest: /docker/tellmon/config/application.properties
    content: |
      spring.datasource.url=jdbc:postgresql://postgres:5432/tellmon
      spring.datasource.username=root
      spring.datasource.password={{ postgres_password_properties }}
      spring.datasource.driver-class-name=org.postgresql.Driver
      app.receiver.host=receiver
      app.receiver.port=3536
      jwt.secret=ib9odfctnU7fIFy3RKcpWeBVHVngG9gy
    owner: "10001"
    group: "10001"
    mode: "0644"
    force: false
  no_log: true

- name: Update shared application.properties password
  ansible.builtin.lineinfile:
    path: /docker/tellmon/config/application.properties
    regexp: '^spring\.datasource\.password\s*='
    line: "spring.datasource.password={{ postgres_password_properties }}"
  no_log: true

- name: Read deployed docker-compose content
  ansible.builtin.slurp:
    path: /docker/tellmon/docker-compose.yml
  register: deployed_compose_file
  no_log: true

- name: Merge updated PostgreSQL password into docker-compose model
  ansible.builtin.set_fact:
    updated_compose: >-
      {{
        (deployed_compose_file.content | b64decode | from_yaml) | combine(
          {
            'services': {
              'postgres': {
                'environment': {
                  'POSTGRES_USER': 'root',
                  'POSTGRES_PASSWORD': postgres_password
                }
              },
              'backend': {
                'environment': {
                  'SPRING_DATASOURCE_PASSWORD': postgres_password
                }
              }
            }
          },
          recursive=True
        )
      }}
  no_log: true

- name: Write updated docker-compose file
  ansible.builtin.copy:
    dest: /docker/tellmon/docker-compose.yml
    content: "{{ updated_compose | to_nice_yaml(indent=2, sort_keys=false) }}"
    mode: "0644"
  no_log: true

- name: Start Tellmon services with updated configuration
  community.docker.docker_compose_v2:
    project_src: /docker/tellmon
    state: present

- name: Wait for receiver to be healthy
  community.docker.docker_container_info:
    name: tellmon_receiver
  until: "container_info.container.State.Health.Status == 'healthy'"
  register: container_info
  retries: 30
  delay: 10

- name: Wait for backend to be healthy
  community.docker.docker_container_info:
    name: tellmon_backend
  until: "container_info.container.State.Health.Status == 'healthy'"
  register: container_info
  retries: 30
  delay: 10
